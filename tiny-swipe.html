<meta name="theme-color" content="#000000">

<style>
:root{
  --ink:#1d2340; --sky:#eef3ff; --card:#ffffff; --line:#d7def2;
  --sun:#ffc93c; --berry:#ff5d73; --leaf:#2bb673; --muted:#5d6788;
  --display:"Baloo 2", ui-rounded, "Segoe UI Rounded", system-ui, sans-serif;
  --body:system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:#000;color:var(--ink);font-family:var(--body);overscroll-behavior:none}
button{font:inherit;cursor:pointer}
[hidden]{display:none!important}
:root{color-scheme:only light}
button,[role=button],input,label{-webkit-tap-highlight-color:transparent}
button:focus:not(:focus-visible),[role=button]:focus:not(:focus-visible){outline:none}
#setup{position:fixed;inset:0;z-index:7;background:#FFD9E4;display:grid;place-items:center;
  font:600 24px/1.3 Roboto,system-ui,-apple-system,"Segoe UI",sans-serif;padding:0 max(24px,env(safe-area-inset-left,0px));text-align:center}
#setupBtn{border:0;border-radius:999px;padding:22px 30px;color:#fff;cursor:pointer;-webkit-tap-highlight-color:transparent;
  background:linear-gradient(135deg,#FF9CC2,#FF5E87);box-shadow:0 6px 0 #D9426A,0 14px 28px rgba(255,94,135,.3);transition:transform .1s,box-shadow .1s}
#setupBtn:active,#setupBtn.down,#startBtn.down{transform:translateY(5px);box-shadow:0 1px 0 #D9426A}
#setupBtn:focus-visible{outline:3px solid #2A2140;outline-offset:4px}
#setupWord{width:min(72vw,380px);height:auto;display:block}
#loading{position:fixed;inset:0;z-index:9;background:#FFD9E4;display:grid;place-items:center;color:#2A2140}
#loading .lbox{display:flex;flex-direction:column;align-items:center;gap:22px;width:min(78vw,320px)}
#loadTitle svg{height:34px;width:auto;display:block}
#loadPct svg{height:28px;width:auto;display:block;color:#FF5E87}
.lwrap{position:relative;width:100%}
.ltrack{height:26px;border-radius:99px;background:#fff;border:3px solid #FF9CC2;overflow:hidden;box-shadow:inset 0 2px 0 rgba(0,0,0,.05)}
#loadFill{height:100%;width:0;border-radius:99px;
  background:repeating-linear-gradient(-45deg,#FF7FA6 0 12px,#FF5E87 12px 24px);background-size:34px 34px;animation:candy .8s linear infinite}
@keyframes candy{to{background-position:34px 0}}
#loadStar{position:absolute;top:50%;left:0;width:40px;height:40px;margin:-20px 0 0 -20px;animation:hop .6s ease-in-out infinite alternate}
#loadStar svg{width:100%;height:100%;display:block;filter:drop-shadow(0 2px 2px rgba(0,0,0,.15))}
@keyframes hop{from{transform:translateY(2px) rotate(-10deg)}to{transform:translateY(-8px) rotate(10deg)}}
@media (prefers-reduced-motion:reduce){#loadFill,#loadStar{animation:none}}
#intro{position:fixed;inset:0;z-index:50;background:#FFD9E4;display:grid;place-items:center;transition:opacity .4s}
#intro.gone{opacity:0;pointer-events:none}
#intro svg{width:min(100vw,100vh);height:min(100vw,100vh);display:block}

/* ---------- kid feed ---------- */
#feed{position:fixed;inset:0;z-index:1;overflow-y:scroll;scroll-snap-type:y mandatory;scrollbar-width:none;-webkit-overflow-scrolling:touch}
#feed::-webkit-scrollbar{display:none}
.slide{position:relative;height:100%;width:100%;scroll-snap-align:start;scroll-snap-stop:always;background:transparent;overflow:hidden}
#stage{position:fixed;inset:0;background:#000;overflow:hidden}
#stage .slot{position:absolute;inset:0;transform:translateY(200%);will-change:transform;background:#000;overflow:hidden}
#stage .slot::before,#stage .slot::after{content:"";position:absolute;left:0;right:0;height:2px;background:#000;z-index:1;pointer-events:none}
#stage .slot::before{top:0}
#stage .slot::after{bottom:0}
/* size each player to the video's own 9:16 shape and fill the screen top to bottom (on tall phones the right edge trims a little) */
#stage iframe,#stage .slot>div{position:absolute;left:0;top:50%;width:var(--vw,100%);height:var(--vh,100%);transform:translateY(-50%);border:0}
.pbox{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
.pbox iframe,.pbox>div{position:absolute;inset:0;width:100%;height:100%;border:0}
.shield{position:absolute;inset:0;z-index:2}
.cover{display:none}
.chan{position:absolute;left:var(--chanx,94px);top:var(--chany,9px);z-index:3;height:24px;max-width:calc(100% - 160px);
  display:flex;align-items:center;gap:7px;border:0;padding:0;background:#000;color:#fff;font:500 14px/1 var(--body);white-space:nowrap}
.chan img,.chan i{width:24px;height:24px;border-radius:50%;flex:none;object-fit:cover}
.chan i{display:grid;place-items:center;font:800 12px var(--display);font-style:normal;color:var(--ink)}
.chan span{overflow:hidden;text-overflow:ellipsis}
.base{position:absolute;left:0;right:0;bottom:0;height:var(--baseh,62px);background:#000;z-index:3}
.sidemask{position:absolute;right:0;bottom:var(--sideb,20px);width:var(--sidew,58px);height:var(--sideh,104px);background:#000;z-index:3;border-radius:14px 0 0 14px}
.hot{position:absolute;left:0;bottom:30px;width:60%;height:44px;z-index:3;border:0;background:transparent;padding:0}
.hot.top{top:0;bottom:auto;left:0;width:calc(100% - 70px);height:56px}
.bottombar{position:absolute;left:0;right:0;bottom:0;height:var(--bottomh,120px);background:#000;z-index:3}
.leftmask{position:absolute;left:0;bottom:var(--baseh,62px);width:var(--leftw,78%);height:var(--lefth,70px);background:#000;z-index:3;border-top-right-radius:14px}
.likemask{position:absolute;right:0;bottom:var(--baseh,62px);width:var(--likew,58px);height:var(--likeh,60px);background:#000;z-index:3;border-top-left-radius:14px}
.topbar{position:absolute;left:calc(10px + env(safe-area-inset-left,0px));top:calc(10px + env(safe-area-inset-top,0px));z-index:3;
  display:flex;align-items:center;gap:6px;max-width:calc(100% - 76px)}
.yt,.tag{height:24px;display:flex;align-items:center;gap:5px;border-radius:999px;background:rgba(0,0,0,.6);
  color:#fff;font:700 13px/1 var(--display);white-space:nowrap}
.yt{padding:0 9px;flex:none}
.tag{border:0;padding:0 9px 0 4px;min-width:0;overflow:hidden;text-overflow:ellipsis}
.tag span{overflow:hidden;text-overflow:ellipsis}
.tag i{width:16px;height:16px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-size:10px;color:var(--ink)}

#sound{position:fixed;left:50%;bottom:calc(80px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:5;
  border:0;border-radius:999px;padding:12px 22px;background:var(--sun);color:var(--ink);font:800 18px/1 var(--display);
  box-shadow:0 6px 0 #d9a51c}
#lock{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));right:calc(12px + env(safe-area-inset-right,0px));z-index:6;
  width:44px;height:44px;border-radius:50%;border:0;background:rgba(255,255,255,.18);color:#fff;display:grid;place-items:center;
  touch-action:none;-webkit-user-select:none;user-select:none}
#lock svg{position:absolute;inset:0}
#lock circle.r{transition:stroke-dashoffset .1s linear}

.modal{position:fixed;inset:0;z-index:8;display:grid;place-items:center;padding:24px;background:rgba(20,16,40,.55)}
.modal .card{width:min(100%,340px);background:#fff;border-radius:24px;padding:24px 20px 20px;text-align:center;display:flex;flex-direction:column;gap:18px}
.modal p{margin:0;font:800 24px/1.15 var(--display);color:var(--ink);text-wrap:balance}
.modal .btns{display:flex;gap:12px}
.modal button{flex:1;border:0;border-radius:16px;padding:14px;font:800 20px/1 var(--display)}
.modal .yes{background:var(--leaf);color:#fff;box-shadow:0 5px 0 #1d8a55}
.modal .no{background:var(--berry);color:#fff;box-shadow:0 5px 0 #c94357}
.math{display:flex;align-items:center;justify-content:center;gap:10px;font:800 26px/1 var(--display);color:var(--ink)}
.math input{width:90px;height:52px;border:2px solid #f0c4d2;border-radius:14px;text-align:center;font:800 26px/1 var(--display);color:var(--ink);background:#fff7fa;outline:none}
.math input:focus{border-color:#FF5E87}
#mathForm{display:flex;flex-direction:column;gap:12px}
.modal p.mathMsg{font:600 14px/1.3 system-ui,sans-serif;color:#c94357;min-height:1.3em}
.math input::-webkit-inner-spin-button,.math input::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
.math input{-moz-appearance:textfield}
.shake{animation:shake .3s}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}

/* ---------- full-screen messages ---------- */
.screen{position:fixed;inset:0;z-index:4;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;
  padding:24px;text-align:center;background:var(--sky)}
.screen h1{margin:0;font:800 clamp(34px,10vw,56px)/1 var(--display);text-wrap:balance}
.screen p{margin:0;max-width:30ch;color:var(--muted);font-size:16px;line-height:1.45}
.wave{font-size:72px;animation:wave 1.6s ease-in-out infinite;transform-origin:70% 70%}
@keyframes wave{0%,100%{transform:rotate(0)}25%{transform:rotate(18deg)}50%{transform:rotate(-8deg)}}
@media (prefers-reduced-motion:reduce){.wave{animation:none}}

/* ---------- parent panel ---------- */
#parent{position:fixed;inset:0;z-index:10;overflow-y:auto;background:var(--bg);color:var(--fg);
  font:16px/1.35 Roboto,system-ui,-apple-system,"Segoe UI",sans-serif;color-scheme:dark;
  --bg:#0f0f0f;--fg:#f1f1f1;--sub:#aaa;--icon:#f1f1f1;--field:#272727;--press:#272727;--line:#3f3f3f;--blue:#3ea6ff;--off:#717171}
#parent.light{color-scheme:light;--bg:#FFD9E4;--fg:#2A2140;--sub:#6E5A68;--icon:#2A2140;--field:#FFC4D5;--press:#FFC4D5;--line:#F5B3C6;--blue:#FF5E87;--off:#E8AFC0}
.view{max-width:600px;margin:0 auto;padding-bottom:calc(32px + env(safe-area-inset-bottom,0px))}
.bar{position:sticky;top:0;z-index:2;display:flex;align-items:center;gap:20px;height:calc(56px + env(safe-area-inset-top,0px));
  padding:env(safe-area-inset-top,0px) max(12px,env(safe-area-inset-right,0px)) 0 max(8px,env(safe-area-inset-left,0px));background:var(--bg)}
.bar h2{margin:0;font-size:22px;font-weight:600;flex:1}
.back{width:44px;height:44px;border:0;background:none;display:grid;place-items:center;border-radius:50%;color:var(--icon)}
.back:active{background:var(--press)}
.sec{margin-top:16px}
.sec h3{margin:0;padding:8px max(16px,env(safe-area-inset-left,0px)) 4px;font-size:18px;font-weight:700;color:var(--fg)}
.item{display:flex;align-items:center;gap:24px;min-height:60px;padding:6px max(16px,env(safe-area-inset-right,0px)) 6px max(18px,env(safe-area-inset-left,0px));
  width:100%;border:0;background:none;text-align:left;font:inherit;color:inherit}
button.item:active,label.item:active{background:var(--press)}
.ic{width:26px;height:26px;flex:none;color:var(--icon)}
.item .t{flex:1;min-width:0}
.item .t small{display:block;font-size:14px;color:var(--sub);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.foot{margin:2px 0 0;padding:0 16px 0 68px;font-size:13px;color:var(--sub);line-height:1.4}
.num,.key{border:0;background:none;font:inherit;color:var(--sub);text-align:right;padding:6px 0;outline:none}
.num{width:56px}
.key{flex:1;min-width:0;text-align:left;color:var(--fg)}
.key::placeholder{color:var(--sub)}
.num:focus,.key:focus{color:var(--fg);box-shadow:0 1px 0 var(--blue)}
.action:disabled{opacity:.5}
#status{margin:0;padding:0 16px 0 68px;font-size:13px;color:var(--sub);min-height:1.2em}
.search{display:flex;gap:8px;padding:8px 16px}
.field{flex:1;min-width:0;height:40px;border:0;border-radius:20px;background:var(--field);padding:0 16px;font:inherit;font-size:15px;color:var(--fg);outline:none}
.field::placeholder{color:var(--sub)}
.field:focus{box-shadow:inset 0 0 0 1px var(--blue)}
.pill{height:36px;border:0;border-radius:18px;padding:0 16px;font:500 14px/1 inherit;font-family:inherit;background:var(--fg);color:var(--bg);flex:none}
.pill:disabled{background:var(--field);color:var(--sub)}
.listbar{display:flex;justify-content:space-between;align-items:center;padding:4px 16px;font-size:14px;color:var(--sub)}
.link{border:0;background:none;padding:4px 0;color:var(--blue);font:500 14px/1 inherit;font-family:inherit}
.av{width:40px;height:40px;border-radius:50%;flex:none;object-fit:cover;display:grid;place-items:center;font-weight:500;font-size:16px;color:#fff;background:#555}
.creator{gap:16px}
.creator .err{color:#ff4e45}
.x{border:0;background:none;color:var(--sub);font-size:22px;line-height:1;padding:4px 6px}
.sw{position:relative;width:40px;height:22px;flex:none}
.sw input{opacity:0;width:100%;height:100%;margin:0;position:absolute;cursor:pointer;z-index:1}
.sw i{position:absolute;inset:4px 0;border-radius:99px;background:var(--off);transition:.2s;pointer-events:none}
.sw i::after{content:"";position:absolute;top:-4px;left:-2px;width:22px;height:22px;border-radius:50%;background:#fff;transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.4)}
.sw input:checked+i{background:var(--blue);opacity:.6}
.sw input:checked+i::after{transform:translateX(22px);background:var(--blue)}
.sw input:focus-visible+i,.back:focus-visible,.item:focus-visible,.pill:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
#searchResults:empty{display:none}
.startWrap{margin-top:28px;padding:0 16px;display:flex;flex-direction:column;align-items:center;gap:10px}
.startWrap .foot{padding:0;text-align:center;color:#c94357;min-height:1.2em}
#startBtn{-webkit-tap-highlight-color:transparent;width:100%;max-width:420px;border:0;border-radius:999px;padding:18px 24px;color:#fff;cursor:pointer;
  background:linear-gradient(135deg,#FF9CC2,#FF5E87);box-shadow:0 6px 0 #D9426A,0 14px 28px rgba(255,94,135,.3);transition:transform .1s,box-shadow .1s}
#startBtn:active{transform:translateY(5px);box-shadow:0 1px 0 #D9426A}
#startBtn:focus-visible{outline:3px solid var(--fg);outline-offset:4px}
.startWord{height:min(9.685vw,51.1px);width:auto;display:block;margin:0 auto}   /* same letter size as the Setup button */
.tl{display:inline}
.info{display:inline-grid;place-items:center;vertical-align:middle;width:28px;height:28px;margin:-6px 0 -4px 4px;border-radius:50%;color:var(--sub);cursor:pointer;flex:none}
.info:active{background:var(--press)}
.info:focus-visible{outline:2px solid var(--blue)}
#infoPop{position:fixed;inset:0;z-index:20;display:grid;place-items:center;padding:24px;background:rgba(20,16,40,.45)}
#infoPop .sheet{width:min(100%,360px);background:var(--bg);color:var(--fg);border-radius:20px;padding:22px 22px 14px;box-shadow:0 12px 40px rgba(0,0,0,.25)}
#infoPop h4{margin:0 0 8px;font-size:18px;font-weight:700}
#infoPop p{margin:0 0 14px;font-size:15px;line-height:1.45;color:var(--sub)}
#infoOk{display:block;margin-left:auto;border:0;background:none;color:var(--blue);font:600 15px/1 inherit;font-family:inherit;padding:10px 4px}
#searchResults{border-bottom:1px solid var(--line)}
</style>
</head>
<body>
<div id="intro"><svg viewBox="0 0 1080 1080" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="ti-bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FF9CC2"/><stop offset="1" stop-color="#FF5E87"/></linearGradient>
    <filter id="ti-sh" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#B8264E" flood-opacity=".35"/></filter>
    <filter id="ti-soft" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="24" stdDeviation="26" flood-color="#FF5E87" flood-opacity=".25"/></filter>
  </defs>
  <g id="ti-letters"></g>
  <g id="ti-icon" filter="url(#ti-soft)">
    <g transform="translate(390 470) scale(.29297)">
      <rect width="1024" height="1024" rx="232" fill="url(#ti-bg)"/>
      <rect x="352" y="300" width="340" height="500" rx="72" fill="#FFD25E" transform="rotate(9 522 550)"/>
      <g id="ti-card"><g filter="url(#ti-sh)" transform="rotate(-6 512 470)">
        <rect x="342" y="220" width="340" height="500" rx="72" fill="#FFFFFF"/>
        <path d="M466 392 Q466 362 492 377 L596 440 Q620 455 596 470 L492 533 Q466 548 466 518 Z" fill="#FF5E87"/>
      </g></g>
      <path id="ti-chev" d="M452 180 L512 128 L572 180" fill="none" stroke="#FFFFFF" stroke-width="34" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M790 250 Q798 300 840 308 Q798 316 790 366 Q782 316 740 308 Q782 300 790 250 Z" fill="#FFF3B0"/>
      <circle cx="232" cy="760" r="22" fill="#FFF3B0"/>
      <circle id="ti-finger" cx="512" cy="700" r="58" fill="#FFFFFF" opacity="0"/>
    </g>
  </g>
  <g id="ti-sparks"></g>
</svg></div>
<script>
(function(){
  // Play every time the app starts. Skip only when Chrome quietly reloads a tab
  // it put to sleep in the background (the user was already in the app).
  if(document.wasDiscarded===true){document.getElementById("intro").remove();return}

const G={"tiny": [{"d": "M3.9 -141.7 Q33.8 -148.2 65.0 -139.1 M35.1 -143.0 L32.5 0.0", "x": 0, "w": 67.60000000000001, "rot": -2, "dy": 0.0}, {"d": "M11.7 -98.8 L11.7 0.0 M11.7 -133.9 L11.7 -133.9", "x": 79.3, "w": 23.400000000000002, "rot": 3, "dy": -3.9000000000000004}, {"d": "M9.1 -101.4 L9.1 0.0 M9.1 -67.6 Q13.0 -104.0 35.1 -104.0 Q54.6 -104.0 54.6 -71.5 L53.3 0.0", "x": 114.4, "w": 63.7, "rot": -1.5, "dy": 2.6}, {"d": "M7.8 -101.4 L7.8 -46.8 Q7.8 -18.2 29.9 -18.2 Q50.7 -18.2 52.0 -46.8 M52.0 -101.4 L52.0 20.8 Q52.0 52.0 26.0 52.0 Q9.1 52.0 3.9 39.0", "x": 189.8, "w": 61.1, "rot": 2, "dy": -2.6}], "swiper": [{"d": "M59.8 -122.2 Q50.7 -145.6 32.5 -145.6 Q7.8 -145.6 7.8 -111.8 Q7.8 -81.9 33.8 -74.1 Q62.4 -65.0 62.4 -35.1 Q62.4 2.6 32.5 2.6 Q10.4 2.6 3.9 -19.5", "x": 0, "w": 67.60000000000001, "rot": 2, "dy": -2.6}, {"d": "M5.2 -101.4 L16.9 0.0 L36.4 -67.6 L55.9 0.0 L67.6 -101.4", "x": 79.3, "w": 72.8, "rot": -1.5, "dy": 2.6}, {"d": "M11.7 -98.8 L11.7 0.0 M11.7 -133.9 L11.7 -133.9", "x": 163.8, "w": 23.400000000000002, "rot": 3, "dy": -3.9000000000000004}, {"d": "M9.1 -101.4 L9.1 54.6 M9.1 -70.2 Q11.7 -104.0 33.8 -104.0 Q57.2 -104.0 57.2 -52.0 Q57.2 1.3 33.8 1.3 Q13.0 1.3 9.1 -28.6", "x": 198.9, "w": 66.3, "rot": 1.5, "dy": -1.3}, {"d": "M10.4 -53.3 L55.9 -53.3 Q57.2 -104.0 32.5 -104.0 Q7.8 -104.0 7.8 -49.4 Q7.8 2.6 33.8 2.6 Q49.4 2.6 57.2 -14.3", "x": 276.9, "w": 65.0, "rot": -2, "dy": 2.6}, {"d": "M9.1 -101.4 L9.1 0.0 M9.1 -62.4 Q15.6 -104.0 45.5 -101.4", "x": 353.59999999999997, "w": 49.4, "rot": 2.5, "dy": -2.6}], "tw": 250.90000000000003, "sw": 403.0, "space": 48, "stroke": 19.5};
const NS="http://www.w3.org/2000/svg",L=document.getElementById("ti-letters");
const INK="#2A2140",BASE=345,START=(1080-(G.tw+G.space+G.sw))/2;
const ORIGIN={x:540,y:540};                       // just inside the top of the icon
function style(p){p.setAttribute("fill","none");p.setAttribute("stroke",INK);p.setAttribute("stroke-width",G.stroke);p.setAttribute("stroke-linecap","round");p.setAttribute("stroke-linejoin","round")}
function mk(d,x){const g=document.createElementNS(NS,"g"),p=document.createElementNS(NS,"path");
  p.setAttribute("d",d);style(p);
  g.appendChild(p);L.appendChild(g);return g}
const tiny=G.tiny.map(l=>({g:mk(l.d),fx:START+l.x,w:l.w,rot:l.rot,dy:l.dy}));
const sw=document.createElementNS(NS,"g");L.appendChild(sw);
G.swiper.forEach(l=>{const p=document.createElementNS(NS,"path");p.setAttribute("d",l.d);p.setAttribute("transform",`translate(${l.x+l.w/2} ${l.dy}) rotate(${l.rot}) translate(${-l.w/2} 0)`);style(p);sw.appendChild(p)});
const swX=START+G.tw+G.space;
const card=document.getElementById("ti-card"),finger=document.getElementById("ti-finger"),chev=document.getElementById("ti-chev"),icon=document.getElementById("ti-icon");

const clamp=v=>Math.max(0,Math.min(1,v)),lerp=(a,b,t)=>a+(b-a)*t;
const easeOut=t=>1-Math.pow(1-t,3);
const back=t=>{const c=1.9;return 1+(c+1)*Math.pow(t-1,3)+c*Math.pow(t-1,2)};
const elastic=t=>t===0||t===1?t:Math.pow(2,-9*t)*Math.sin((t*10-.75)*2*Math.PI/3)+1;

const T0=.7,STEP=.6,DUR=.85,SW=T0+4*STEP+.35,SWD=1.3,END=SW+SWD,LOOP=END+1.8;
// swipe gestures: one per letter, one longer for "Swiper"
const swipes=[0,1,2,3].map(i=>({t:T0+i*STEP-.12,d:.32})).concat([{t:SW-.15,d:.55}]);

function swipeState(t){
  for(const s of swipes){const k=(t-s.t)/s.d;if(k>=0&&k<=1.35)return k}
  return -1;
}
function frame(t){
  // icon pops in
  const pop=clamp(t/.55),ps=pop<1?back(pop):1;
  icon.setAttribute("transform",`translate(540 620) scale(${Math.max(.001,ps)}) translate(-540 -620)`);
  // finger swipe + card nudge
  const k=swipeState(t);
  if(k>=0){
    const m=clamp(k);finger.setAttribute("opacity",(k<1?Math.sin(m*Math.PI)*.55:0).toFixed(3));
    finger.setAttribute("cy",lerp(720,260,easeOut(m)));
    const nud=k<=1?Math.sin(m*Math.PI)*-70:0;card.setAttribute("transform",`translate(0 ${nud.toFixed(1)})`);
    chev.setAttribute("transform",`translate(0 ${(k<=1?Math.sin(m*Math.PI)*-40:0).toFixed(1)})`);
  }else{finger.setAttribute("opacity",0);card.removeAttribute("transform");chev.removeAttribute("transform")}
  // T-i-n-y: each letter rises out of the top of the icon, then hops into place
  const TOP=470,LIFT=360;
  tiny.forEach((o,i)=>{
    const p=clamp((t-(T0+i*STEP))/DUR);
    if(p<=0){o.g.setAttribute("opacity",0);return}
    o.g.setAttribute("opacity",1);
    let x,y,s,rot;
    if(p<.4){const a=easeOut(p/.4);x=ORIGIN.x-o.w/2;y=lerp(TOP+130,LIFT,a);s=lerp(.55,.9,a);rot=0}
    else{const b=(p-.4)/.6,e=back(b);x=lerp(ORIGIN.x-o.w/2,o.fx,easeOut(b));y=lerp(LIFT,BASE+o.dy,e)-Math.sin(b*Math.PI)*90;s=lerp(.9,1,e);rot=Math.sin(b*Math.PI)*(i%2?-18:18)+o.rot*e}
    o.g.setAttribute("transform",`translate(${x+o.w/2} ${y}) rotate(${rot}) scale(${s}) translate(${-o.w/2} 0)`);
  });
  // "Swiper" gets pulled out in one long stretch, then snaps into place
  const q=clamp((t-SW)/SWD);
  if(q<=0)sw.setAttribute("opacity",0);
  else{
    sw.setAttribute("opacity",1);let x,y,sx,sy;
    if(q<.45){const a=easeOut(q/.45);y=lerp(TOP+150,LIFT+10,a);sy=lerp(1.9,1.6,a);sx=lerp(.28,.34,a);x=Math.max(ORIGIN.x-G.sw*sx/2,START+G.tw+30)}
    else{const b=(q-.45)/.55,e=elastic(b);sy=lerp(1.6,1,e);sx=lerp(.34,1,e);x=lerp(Math.max(ORIGIN.x-G.sw*.17,START+G.tw+30),swX,easeOut(Math.min(1,b*2.2)));y=lerp(LIFT+10,BASE,easeOut(Math.max(0,b*1.6-.35)))}
    sw.setAttribute("transform",`translate(${x} ${y}) scale(${sx.toFixed(3)} ${sy.toFixed(3)})`);
  }
}

let t0=null;
function tick(now){if(t0===null)t0=now;const t=(now-t0)/1000;frame(Math.min(t,END));
  if(t<END+.9)requestAnimationFrame(tick);
  else{const o=document.getElementById("intro");o.classList.add("gone");setTimeout(()=>o.remove(),450)}}
frame(0);requestAnimationFrame(tick);

})();
</script>

<script>
// Paste your key here to skip entering it in settings:
const API_KEY="";
const SIX_HOURS=6*3600*1000;
const COLORS=["#ffc93c","#ff8fa3","#7cc6ff","#9be3b4","#c9a7ff","#ffb36b"];
const CATALOG=[  // [id, name, handle, on by default, title filter]
  ["msrachel","Ms Rachel","@msrachel",1],

  ["pawpatrol","PAW Patrol","@PAWPatrolOfficial"],
  ["nickjr","Nick Jr.","@NickJr"],
  ["wiggles","The Wiggles","@TheWiggles"],
  ["diana","Kids Diana Show","@KidsDianaShow"],
  ["nastya","Like Nastya","@LikeNastyaofficial"],
  ["ryan","Ryan's World","@RyansWorld"],
  ["vladniki","Vlad and Niki","@VladandNiki"],
  ["daveava","Dave and Ava","@DaveandAva"],
  ["chuchu","ChuChu TV","@ChuChuTV"],
  ["dannygo","Danny Go!","@DannyGo"],
  ["bouncepatrol","Bounce Patrol","@BouncePatrol"],
  ["mothergoose","Mother Goose Club","@MotherGooseClub"],
  ["heybear","Hey Bear Sensory","@HeyBearSensory"],
  ["caitie","Caitie's Classroom","@CaitiesClassroom"],
  ["pocoyo","Pocoyo","@Pocoyo"],
  ["thomas","Thomas & Friends","@ThomasAndFriends"],
  ["numberblocks","Numberblocks","@Numberblocks"],
  ["alphablocks","Alphablocks","@Alphablocks"],
  ["heyduggee","Hey Duggee","@HeyDuggeeOfficial"],
  ["storybots","StoryBots","@StoryBots"],
  ["jackhartmann","Jack Hartmann Kids Music","@JackHartmann"],
  ["gracie","Gracie's Corner","@GraciesCorner"],
  ["littleangel","Little Angel","@LittleAngel"],
  ["moonbug","Moonbug Kids","@MoonbugKids"],
  ["masha","Masha and the Bear","@MashaandtheBear"],
  ["babyeinstein","Baby Einstein","@BabyEinstein"],
  ["pattyshukla","Patty Shukla","@PattyShukla"],
  ["cosmicyoga","Cosmic Kids Yoga","@CosmicKidsYoga"],
  ["gonoodle","GoNoodle","@GoNoodle"],
  ["lingokids","Lingokids","@Lingokids"],
  ["kiboomers","The Kiboomers","@TheKiboomers"],
  ["dreamenglish","Dream English Kids","@DreamEnglishKids"],
  ["babybus","BabyBus","@BabyBus"],
  ["toddlerfun","Toddler Fun Learning","@ToddlerFunLearning"],
  ["morphle","Morphle","@Morphle"]
].map(([id,name,handle,on,filter])=>({id,name,handle,on:!!on,filter:filter||""}));
const KEY="tinyswipe.v1";
let S;
function load(){
  try{S=JSON.parse(localStorage.getItem(KEY))}catch(e){S=null}
  if(!S||!S.creators){S={apiKey:API_KEY,lastPull:0,limit:10,maxSec:0,creators:[]}}
  if(S.v!==3){S.creators.forEach(c=>{c.auto=[];c.err=""});S.lastPull=0;S.v=3}
  for(const c of CATALOG){if(!S.creators.some(x=>x.id===c.id))S.creators.push({...c,auto:[],manual:[]})}
  if(!S.apiKey&&API_KEY)S.apiKey=API_KEY;
  S.creators.forEach(c=>{c.manual=c.manual||[];c.auto=c.auto||[]});
}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
load();

const $=id=>document.getElementById(id);
const feedEl=$("feed");
function sizePlayers(){
  const W=feedEl.clientWidth||innerWidth,H=feedEl.clientHeight||innerHeight;
  const pw=Math.max(W,H*9/16),ph=pw*16/9;
  document.documentElement.style.setProperty("--pw",pw+"px");
  document.documentElement.style.setProperty("--ph",ph+"px");
}

let feed=[],active=-1,seen=new Set(),muted=false,needSound=false,ytReady=false,io=null,parentOpen=false;

/* ---------- feed ---------- */
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a}
function buildFeed(){
  const pools=S.creators.filter(c=>c.on).map((c,ci)=>({c,clips:shuffle([...c.manual,...c.auto])})).filter(p=>p.clips.length);
  const list=[];let more=true,k=0;
  while(more){more=false;for(const p of pools){if(k<p.clips.length){list.push({...p.clips[k],creator:p.c.id});more=true}}k++}
  if(!list.length)return [];
  let out=list.slice(0,400);while(out.length<30)out=out.concat(shuffle(list));
  return out;
}
function creatorOf(id){return S.creators.find(c=>c.id===id)}
function colorOf(id){return COLORS[S.creators.findIndex(c=>c.id===id)%COLORS.length]}

function needsSetup(){return !S.apiKey||!S.creators.some(c=>c.on)}
let atSetup=false;   // true after leaving Settings with the back arrow
function showSetup(){const on=(needsSetup()||atSetup)&&!parentOpen;$("setup").hidden=!on;$("setup").classList.toggle("light",S.theme==="light");$("lock").hidden=on||parentOpen;return on}
// same press-down effect on both big buttons; the action runs after the press is seen
function pressable(el,fn){
  el.addEventListener("pointerdown",()=>el.classList.add("down"));
  ["pointerup","pointerleave","pointercancel"].forEach(t=>el.addEventListener(t,()=>el.classList.remove("down")));
  el.addEventListener("click",()=>{el.classList.add("down");setTimeout(()=>{el.classList.remove("down");fn()},140)});
}
pressable($("setupBtn"),openParent);
showSetup();
function render(){
  slots.forEach(s=>{s.idx=-1;s.primed=false;try{s.p&&s.p.pauseVideo()}catch(e){}});showSlot(null);
  if(io)io.disconnect();
  feed=buildFeed();active=-1;seen=new Set();
  feedEl.innerHTML="";feedEl.scrollTop=0;
  $("done").hidden=true;
  $("empty").hidden=feed.length>0||showSetup();
  if(!feed.length){
    const on=S.creators.filter(c=>c.on),bad=on.find(c=>c.err);
    $("empty").querySelector("h1").textContent=S.apiKey?"No videos yet":"Grown-up setup";
    $("empty").querySelector("p").textContent=!S.apiKey?"Tap the lock, then add your API key in Settings.":
      !on.length?"No channels are on. Tap the lock and turn some on in Channels.":
      bad?`${bad.name}: ${bad.err}. Tap the lock to check Channels.`:"Tap the lock and choose Refresh videos.";
  }
  feed.forEach((clip,i)=>{
    const c=creatorOf(clip.creator)||{name:"?"};
    const s=document.createElement("section");s.className="slide";s.dataset.i=i;
    s.innerHTML=`<div class="cover"></div><div class="shield"></div>
      <button type="button" class="hot" aria-label="Visit ${esc(c.name)} channel"></button><button type="button" class="hot top" aria-label="Visit ${esc(c.name)} channel"></button>`;
    s.querySelector(".shield").addEventListener("click",()=>togglePlay(i));
    s.querySelectorAll(".hot").forEach(b=>b.addEventListener("click",()=>askVisit(clip.creator)));
    feedEl.appendChild(s);
  });
  io=new IntersectionObserver(es=>{es.forEach(e=>{if(e.isIntersecting&&e.intersectionRatio>=.5)setActive(+e.target.dataset.i)})},{root:feedEl,threshold:[.5]});
  feedEl.querySelectorAll(".slide").forEach(s=>io.observe(s));
}
function esc(t){return String(t).replace(/[&<>"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]))}

// Two YouTube players are created once and reused. One shows the current clip,
// the other silently loads the next clip and waits paused at the start, so a
// swipe just swaps which player is visible. No iframe is rebuilt per swipe.
// three players: previous, current and next, so both neighbours stay visible while swiping
const slots=[0,1,2].map(()=>({el:null,p:null,ready:false,idx:-1,primed:false}));
let wd1=0,wd2=0;
function cover(i,on){const c=feedEl.querySelector(`.slide[data-i="${i}"] .cover`);if(c)c.classList.toggle("off",!on)}
function fitVideos(){
  const W=innerWidth,H=innerHeight,w=Math.max(W,H*9/16),hh=w*16/9;
  document.documentElement.style.setProperty("--vw",w+"px");document.documentElement.style.setProperty("--vh",hh+"px");
}
fitVideos();addEventListener("resize",fitVideos);
function placeSlots(){
  const H=feedEl.clientHeight,top=feedEl.scrollTop;
  slots.forEach(s=>{if(s.el)s.el.style.transform=s.idx<0?"translateY(200%)":`translateY(${s.idx*H-top}px)`});
}
function showSlot(){placeSlots()}
// While a swipe is moving, neighbouring videos play silently so YouTube never shows its
// pause button on them. Once the swipe settles, the off-screen ones pause again.
let settleT=0,swiping=false;
function onSwipe(){
  placeSlots();
  if(!swiping&&!parentOpen&&!atSetup){
    swiping=true;
    slots.forEach(s=>{if(s.idx>=0&&s.idx!==active&&s.primed){try{s.p.mute();s.p.playVideo()}catch(e){}}});
  }
  clearTimeout(settleT);settleT=setTimeout(settle,180);
}
function settle(){
  swiping=false;
  slots.forEach(s=>{if(s.idx>=0&&s.idx!==active){try{s.p.pauseVideo();s.p.seekTo(0,true)}catch(e){}}});

  }
  let clips=[],seenShorts=0,notKids=0;
  try{clips=await walk("UUSH"+base,180)}catch(e){ if(!/not ?found/i.test(e.message))throw e }   // true Shorts only
  if(!clips.length)throw new Error(!seenShorts?"This channel has no Shorts":notKids===seenShorts?"Shorts aren't marked Made for Kids":"No playable Shorts");
  return clips;
}
async function pullAll(list,onFirst,maxPages=2,workers=4,track=false){
  if(!S.apiKey||!list.length)return;
  let total=0,fired=false;
  const queue=list.slice();
  async function worker(){
    while(queue.length){
      const c=queue.shift();
      try{const got=await pullCreator(c,maxPages);if(got.length>=c.auto.length||maxPages>1)c.auto=got;c.err="";total+=c.auto.length}
      catch(e){c.auto=[];c.err=e.message}
      if(track){loadD++;loadBar()}
      save();if(parentOpen)drawCreators();
      if(!fired&&total&&onFirst){fired=true;onFirst()}
    }
  }
  await Promise.all(Array.from({length:workers},worker));
  if(list.length===S.creators.filter(c=>c.on).length)S.lastPull=Date.now();
  save();
}
// quiet background refresh: every 6 hours, even if the app stays open
setInterval(()=>{
  if(!S.apiKey||Date.now()-(S.lastPull||0)<SIX_HOURS)return;
  S.lastPull=Date.now();save();
  pullAll(S.creators.filter(c=>c.on),null,2,1);
},30*60*1000);
</script>
